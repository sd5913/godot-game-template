name: Deploy web (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: .codex/setup.sh
      - run: mkdir -p build/web && touch build/.gdignore && "$HOME/.cache/sd5913-godot-4.5.1/godot" --headless --path . --export-release Web build/web/index.html
      - run: npx --yes wrangler@4 deploy --assets ./build/web --name "$WORKER_NAME"
        env:
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
